name: API Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # 2 AM UTC / 9 PM hora Colombia

permissions:
  contents: write

# Forzamos globalmente el uso de Node 24 para limpiar los warnings de GitHub
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Entorno Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar Pruebas de API
        run: mvn clean test
        continue-on-error: true # Permite que el pipeline continúe para generar el reporte aunque fallen tests

      - name: Obtener Historial de Allure
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generar Reporte de Allure y Desplegar
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20
          gh_pages: gh-pages
